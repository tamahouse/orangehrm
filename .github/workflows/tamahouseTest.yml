name: Build, Push & Test OrangeHRM

on:
  push:
    branches: ["master"]

env:
  RESULT_ROOT: /opt/allure-results

permissions:
  contents: write

jobs:

# ==========================================
# Build allure-nginx only when changed
# ==========================================
  build-allure-nginx:
      uses: tamahouse/orangehrm-traefik/.github/workflows/build-allure-nginx.yml@main
      secrets: inherit

  # ==========================================
  # JOB 1: Build & Deploy
  # ==========================================
  build-deploy:
    needs:
      - build-allure-nginx

    runs-on: ubuntu-latest

    outputs:
      TEMP_TAG: ${{ steps.export_vars.outputs.TEMP_TAG }}

    steps:

      - name: Checkout orangehrm code
        uses: actions/checkout@v4

      - name: Set temp tag
        id: export_vars
        run: echo "TEMP_TAG=temp-${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Build temp version
        run: |
          docker build \
            -t tamahouse/orangehrm:${{ steps.export_vars.outputs.TEMP_TAG }} \
            .

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Push temp version
        run: |
          docker push \
            tamahouse/orangehrm:${{ steps.export_vars.outputs.TEMP_TAG }}

      - name: Deploy temp version on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
            host: ${{ secrets.VPS_HOST }}
            username: ${{ secrets.VPS_USER }}
            key: ${{ secrets.VPS_SSH_KEY }}
            script: |
              if [ ! -d "/opt/orangehrm-traefik" ]; then
                cd /opt
                sudo git clone https://github.com/tamahouse/orangehrm-traefik.git
              fi
              cd /opt/orangehrm-traefik
              sudo  git pull origin main
              export TAG=${{ steps.export_vars.outputs.TEMP_TAG }}
              sudo docker compose pull
              sudo docker compose up -d


  # ==========================================
  # JOB 2: Run E2E Tests
  # ==========================================
  e2e-tests:
    needs: build-deploy

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        browser: [chrome]

    steps:

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout automation repo
        uses: actions/checkout@v4
        with:
          repository: tamahouse/orangehrm-demo-automation
          path: automation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Selenium
        run: |
          sudo docker run -d \
            -p 4444:4444 \
            --name selenium \
            selenium/standalone-${{ matrix.browser }}

      - name: Run tests
        working-directory: automation
        run: |
          mvn clean test \
            -Pregression \
            -Devn=staging \
            -Dbrowser=${{ matrix.browser }} \
            -DbaseUrl=https://chaseqa.duckdns.org \
            -DremoteUrl=http://localhost:4444

      - name: Verify allure results
        if: always()
        run: |

          if [ ! -d "automation/target/allure-results" ]; then
            echo "❌ No allure-results folder"
            exit 0
          fi

          echo "📂 Result files:"
          ls -la automation/target/allure-results

          if [ -z "$(ls -A automation/target/allure-results)" ]; then
            echo "❌ allure-results empty"
            exit 0
          fi

      - name: Prepare VPS folders
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |

            sudo mkdir -p \
              ${{ env.RESULT_ROOT }}/${{ needs.build-deploy.outputs.TEMP_TAG }}/${{ matrix.browser }}

            sudo chown -R \
              $(whoami):$(whoami) \
              ${{ env.RESULT_ROOT }}

      - name: Upload allure results
        if: always()
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          source: "automation/target/allure-results/*"

          target: "${{ env.RESULT_ROOT }}/${{ needs.build-deploy.outputs.TEMP_TAG }}/${{ matrix.browser }}"

          strip_components: 3

      - name: Verify uploaded results
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            ls -la \
              ${{ env.RESULT_ROOT }}/${{ needs.build-deploy.outputs.TEMP_TAG }}

      - name: Stop Selenium
        if: always()
        run: docker rm -f selenium

  # ==========================================
  # JOB 3: Finalize
  # ==========================================
  finalize:
    needs: [build-deploy, e2e-tests]

    if: always()

    runs-on: ubuntu-latest

    outputs:
      NEW_VERSION: ${{ steps.bump_version.outputs.NEW_VERSION }}

    steps:

      # ======================================
      # Reporting
      # ======================================

      - name: Checkout automation repo
        uses: actions/checkout@v4
        with:
          repository: tamahouse/orangehrm-demo-automation
          path: automation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare report-tools folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            sudo mkdir -p /opt/report-tools
            sudo chown -R $(whoami):$(whoami) /opt/report-tools

      - name: Upload reporting tools
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          source: "automation/report/*"

          target: "/opt/report-tools"

          strip_components: 2

      - name: Generate reports
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |

            chmod +x /opt/report-tools/*.sh

            /opt/report-tools/run-report.sh \
              "${{ needs.build-deploy.outputs.TEMP_TAG }}"

      # ======================================
      # Promote Image
      # ======================================

      - name: Login Docker Hub
        if: needs.e2e-tests.result == 'success'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Checkout orangehrm repo
        if: needs.e2e-tests.result == 'success'
        uses: actions/checkout@v4

      - name: Get latest version
        if: needs.e2e-tests.result == 'success'
        id: get_version
        run: |

          git fetch --tags

          VERSION=$(
            git tag \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n1
          )

          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi

          echo "CURRENT_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Bump version
        if: needs.e2e-tests.result == 'success'
        id: bump_version
        run: |

          VERSION=${CURRENT_VERSION#v}

          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)

          PATCH=$((PATCH + 1))

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"

          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Promote image
        if: needs.e2e-tests.result == 'success'
        run: |

          docker pull \
            tamahouse/orangehrm:${{ needs.build-deploy.outputs.TEMP_TAG }}

          docker tag \
            tamahouse/orangehrm:${{ needs.build-deploy.outputs.TEMP_TAG }} \
            tamahouse/orangehrm:${{ steps.bump_version.outputs.NEW_VERSION }}

          docker tag \
            tamahouse/orangehrm:${{ needs.build-deploy.outputs.TEMP_TAG }} \
            tamahouse/orangehrm:stable

          docker push \
            tamahouse/orangehrm:${{ steps.bump_version.outputs.NEW_VERSION }}

          docker push tamahouse/orangehrm:stable

      - name: Create git tag
        if: needs.e2e-tests.result == 'success'
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git tag \
            ${{ steps.bump_version.outputs.NEW_VERSION }}

          git push origin \
            ${{ steps.bump_version.outputs.NEW_VERSION }}

      # ======================================
      # Deploy Stable
      # ======================================

      - name: Deploy stable version
        if: needs.e2e-tests.result == 'success'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |

            cd /opt/orangehrm-traefik

            export TAG=${{ steps.bump_version.outputs.NEW_VERSION }}

            docker compose pull

            docker compose up -d

      # ======================================
      # Rollback
      # ======================================

      - name: Rollback to stable
        if: needs.e2e-tests.result != 'success'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |

            cd /opt/orangehrm-traefik

            export TAG=stable

            docker compose pull

            docker compose up -d